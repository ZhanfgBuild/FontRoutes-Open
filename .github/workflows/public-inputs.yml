name: Build FontRoutes Open inputs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-inputs:
    name: Build and verify ${{ matrix.edition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: op13-full
            edition: OnePlus 13 Full inputs
          - profile: op6-slim
            edition: OnePlus 6 Slim inputs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check builder
        run: python3 -m unittest discover -s tests -v
      - name: Build public pinned font inputs
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 build.py inputs --profile "$PROFILE"
      - name: Upload only public inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FontRoutes-Open-${{ matrix.profile }}-inputs
          path: dist/FontRoutes-Open-${{ matrix.profile }}-inputs-*
          if-no-files-found: error
          retention-days: 7

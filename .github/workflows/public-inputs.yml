name: Build FontRoutes Open inputs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-inputs:
    name: Build and verify ${{ matrix.edition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: inputs
            profile: op13-full
            artifact: op13-full-inputs
            edition: OnePlus 13 Full inputs
          - mode: inputs
            profile: op6-slim
            artifact: op6-slim-inputs
            edition: OnePlus 6 Slim inputs
          - mode: logos
            artifact: logos-brand-use
            edition: Font Awesome Brands standalone
          - mode: emoji
            artifact: emoji-2d-app-use
            edition: Noto Emoji 2D standalone
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check builder
        run: python3 -m unittest discover -s tests -v
      - name: Build verified public fonts or standalone app library
        env:
          MODE: ${{ matrix.mode }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [ "$MODE" = inputs ]; then
            python3 build.py inputs --profile "$PROFILE"
          else
            python3 build.py "$MODE"
          fi
      - name: Check exact one-codepoint local logo derivative
        if: matrix.mode == 'logos'
        env:
          FONTROUTES_INTEGRATION_ASSETS: "1"
        run: |
          set -euo pipefail
          python3 -m venv .logo-venv
          .logo-venv/bin/python -m pip install -r requirements-logo.txt
          .logo-venv/bin/python -m unittest discover -s tests -p test_logo_fallback.py -v
      - name: Upload only public inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FontRoutes-Open-${{ matrix.artifact }}
          path: dist/FontRoutes-Open-${{ matrix.artifact }}-*
          if-no-files-found: error
          retention-days: 7
